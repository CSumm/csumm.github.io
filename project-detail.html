<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Detail - Carl Summers</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <style>
      .gif-container {
        text-align: center;
      }
      .gif-controls button {
        margin-top: 10px;
      }
      </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light">
    <div class="container">
      <a class="navbar-brand" href="index.html">Carl Summers</a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="index.html#projects">Projects</a></li>
          <li class="nav-item mt-1 ms-2"><a class="btn btn-primary" href="contact.html">Contact</a></li>
        </ul>
      </div>
    </div>
  </nav>
  
  <section class="py-5">
    <details class="p-3 border rounded-3 container" role="region" aria-labelledby="show-demo-video">
      <summary id="show-demo-video">Show/Hide demo video</summary>
      <img src="" id="myGif" class="gif-container" alt="Project GIF">
      <img class="d-block mt-2 w-100 portfolio-image" src="https://placehold.co/1300x500" id="pauseImage" style="display: none;">
    </details>
    <div class="container mt-5" role="region" aria-labelledby="project-detail">
      <p class="mb-4 w-50 mx-auto visually-hidden" id="project-detail">Project Detail</p>
      <a href="#" class="d-flex align-items-center mb-4 float-end btn btn-outline-primary js-portfolio-link" target="_blank">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-box-arrow-up-right me-1" viewBox="0 0 16 16">
          <path fill-rule="evenodd" d="M8.636 3.5a.5.5 0 0 0-.5-.5H1.5A1.5 1.5 0 0 0 0 4.5v10A1.5 1.5 0 0 0 1.5 16h10a1.5 1.5 0 0 0 1.5-1.5V7.864a.5.5 0 0 0-1 0V14.5a.5.5 0 0 1-.5.5h-10a.5.5 0 0 1-.5-.5v-10a.5.5 0 0 1 .5-.5h6.636a.5.5 0 0 0 .5-.5"/>
          <path fill-rule="evenodd" d="M16 .5a.5.5 0 0 0-.5-.5h-5a.5.5 0 0 0 0 1h3.793L6.146 9.146a.5.5 0 1 0 .708.708L15 1.707V5.5a.5.5 0 0 0 1 0z"/>
        </svg>
        <span>Open project</span>
      </a>
      <h1 class="mb-4 js-portfolio-title" style="width: fit-content;">Project Title</h1>
      <div class="d-flex flex-column">
        <div>
          <h2 class="mb-4">Who was involved</h2>
          <p class="js-portfolio-involvement">Lorem ipsum...</p>
        </div>
        <div>
          <h2 class="mb-4">What was my role</h2>
          <p class="js-portfolio-role">Lorem ipsum...</p>
        </div>
        <div>
          <h2 class="mb-4">Key development factors</h2>
          <p class="js-portfolio-factors">Lorem ipsum...</p>
        </div>
      </div>
      <div class="mt-4">
        <a href="index.html#projects" class="mb-4 btn-link" style="min-width: 44px; min-height: 44px; line-height: 32px;"><span>&larr;</span> Back to list of projects</a>
      </div>
    </div>
  </section>
  
  <footer class="text-center py-4 bg-light mt-5">
    <p class="mb-0">Carl Summers circa. 2025</p>
  </footer>
  
  <script>
    const gif = document.getElementById('myGif');
    const pauseImage = document.getElementById('pauseImage');
  
    document.querySelector('summary').addEventListener('click', () => {
      if (gif.style.display === 'none') {
        gif.style.display = 'block';
        pauseImage.style.display = 'none';
      } else {
        gif.style.display = 'none';
        pauseImage.style.display = 'block';
      }
    });
  </script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/project-detail.js"></script>
</body>
</html>
